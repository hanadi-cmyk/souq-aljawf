<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول | منصة الجوف الزراعية</title>
  <link rel="stylesheet" href="../assets/css/cairo.css">
  <script src="../assets/js/tailwind.js"></script>
  <link rel="stylesheet" href="../assets/css/all.min.css">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-emerald-800 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-md">
        <i class="fa-solid fa-seedling"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900">تسجيل الدخول</h1>
      <p class="text-xs text-slate-500">منصة الجوف للتسويق والاستثمار الزراعي</p>
    </div>

    <div class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1.5">رقم الهاتف أو البريد الإلكتروني:</label>
        <div class="relative">
          <input type="text" placeholder="مثال: 770000000 أو user@aljawf-agro.ye" class="w-full p-3 pr-10 border border-slate-300 rounded-xl outline-none focus:border-emerald-700 text-slate-900 font-medium">
          <i class="fa-solid fa-user-check absolute right-3.5 top-3.5 text-slate-400"></i>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="font-bold text-slate-700">كلمة المرور:</label>
          <a href="#" class="text-emerald-700 hover:underline font-semibold">نسيت كلمة المرور؟</a>
        </div>
        <div class="relative">
          <input type="password" placeholder="••••••••" class="w-full p-3 pr-10 border border-slate-300 rounded-xl outline-none focus:border-emerald-700 text-slate-900">
          <i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-slate-400"></i>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="rem" class="rounded text-emerald-700">
        <label for="rem" class="text-slate-600 font-medium">تذكر تسجيل دخولي</label>
      </div>

      <button class="w-full py-3 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl shadow-lg transition text-sm">
        دخول للمنصة
      </button>

      <div class="text-center text-slate-500 pt-2">
       هل انت مستخدم جديد <a href="#" class="text-emerald-800 font-bold hover:underline">إنشاء حساب </a>
      </div>
    </div>
  </div>
</body>
</html>
