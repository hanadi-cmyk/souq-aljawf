<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور | منصة الجوف الزراعية</title>
  <link rel="stylesheet" href="../assets/css/cairo.css">
  <script src="../assets/js/tailwind.js"></script>
  <link rel="stylesheet" href="../assets/css/all.min.css">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">

    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-3xl flex items-center justify-center text-2xl mx-auto shadow-sm">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900">تعيين كلمة مرور جديدة</h1>
      <p class="text-xs text-slate-500">أدخل كلمة المرور الجديدة لحسابك الزراعي لتأمين تعاملاتك</p>
    </div>

    <!-- Form -->
    <form class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1.5">كلمة المرور الجديدة:</label>
        <div class="relative">
          <input type="password" value="Jowf@2026!Strong" class="w-full p-3 pr-10 border border-slate-300 rounded-xl outline-none focus:border-emerald-700 text-slate-900 font-bold">
          <i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-slate-400"></i>
          <button type="button" class="absolute left-3.5 top-3.5 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>

      <!-- Password Strength Indicator -->
      <div class="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div class="flex justify-between items-center text-[11px] font-bold">
          <span class="text-slate-600">قوة كلمة المرور:</span>
          <span class="text-emerald-700">قوية جداً (ممتاز)</span>
        </div>
        <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden flex gap-1">
          <div class="h-full w-1/4 bg-emerald-500 rounded-full"></div>
          <div class="h-full w-1/4 bg-emerald-500 rounded-full"></div>
          <div class="h-full w-1/4 bg-emerald-500 rounded-full"></div>
          <div class="h-full w-1/4 bg-emerald-600 rounded-full"></div>
        </div>
        <ul class="text-[10px] text-slate-500 space-y-0.5 pt-1">
          <li class="text-emerald-700 font-bold"><i class="fa-solid fa-check ml-1"></i> لا تقل عن 8 خانات</li>
          <li class="text-emerald-700 font-bold"><i class="fa-solid fa-check ml-1"></i> تحتوي على أحرف كبيرة وأرقام ورموز</li>
        </ul>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1.5">تأكيد كلمة المرور الجديدة:</label>
        <div class="relative">
          <input type="password" value="Jowf@2026!Strong" class="w-full p-3 pr-10 border border-emerald-600 bg-emerald-50/20 rounded-xl outline-none text-slate-900 font-bold">
          <i class="fa-solid fa-circle-check absolute right-3.5 top-3.5 text-emerald-600"></i>
        </div>
      </div>

      <div class="pt-2">
        <a href="01_تسجيل_الدخول.html" class="block w-full py-3.5 bg-emerald-800 hover:bg-emerald-900 text-white font-black rounded-xl text-center shadow-lg transition text-sm">
          حفظ كلمة المرور وتسجيل الدخول
        </a>
      </div>
    </form>

    <div class="text-center">
      <a href="01_تسجيل_الدخول.html" class="text-xs font-bold text-slate-500 hover:text-slate-700">
        تذكرت كلمة المرور؟ تسجيل الدخول
      </a>
    </div>

  </div>

</body>
</html>
